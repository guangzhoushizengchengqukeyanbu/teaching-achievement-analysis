<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广州市教学成果智能分析平台 - 增城区专项</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            --primary-color: #1e40af;
            --secondary-color: #3b82f6;
            --accent-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1e293b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部样式 */
        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }
        
        .main-title {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #60a5fa, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.3rem;
            color: var(--text-secondary);
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.8;
        }
        
        /* 筛选控制栏 */
        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            color: var(--text-secondary);
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        /* 主内容区网格 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }
        
        /* 卡片通用样式 */
        .dashboard-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title svg {
            width: 24px;
            height: 24px;
            fill: var(--secondary-color);
        }
        
        /* 图表容器 */
        .chart-container {
            width: 100%;
            height: 400px;
            margin: 15px 0;
        }
        
        /* 区域选择地图 */
        #districtSelector {
            grid-column: span 4;
            height: 500px;
        }
        
        /* 成果列表 */
        .achievement-list-container {
            grid-column: span 4;
            max-height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        .achievement-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .achievement-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .achievement-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        .achievement-list::-webkit-scrollbar-thumb {
            background: var(--secondary-color);
            border-radius: 4px;
        }
        
        .achievement-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--secondary-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .achievement-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
            border-left-color: var(--accent-color);
        }
        
        .achievement-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .achievement-meta {
            display: flex;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        
        .project-level {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .level-key {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
        }
        
        .level-general {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning-color);
        }
        
        /* 统计分析卡片 */
        .stats-card {
            grid-column: span 3;
            text-align: center;
            padding: 30px 20px;
        }
        
        .stat-number {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }
        
        /* 详情模态框 */
        .detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .detail-modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #1e293b;
            width: 100%;
            max-width: 1200px;
            max-height: 90vh;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            padding: 30px;
            position: relative;
        }
        
        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-right: 60px;
            line-height: 1.4;
        }
        
        .close-modal {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .close-modal:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }
        
        .modal-body {
            padding: 30px;
            overflow-y: auto;
            max-height: 60vh;
        }
        
        .detail-section {
            margin-bottom: 30px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }
        
        .section-icon {
            width: 24px;
            height: 24px;
            fill: var(--accent-color);
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-color);
        }
        
        .strength-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.95rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .warning-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning-color);
            padding: 8px 16px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.95rem;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .suggestion-item, .plan-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--warning-color);
        }
        
        .plan-item {
            border-left-color: var(--secondary-color);
        }
        
        .reference-box {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--secondary-color);
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .reference-title {
            color: var(--secondary-color);
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        /* 响应式设计 */
        @media (max-width: 1400px) {
            .dashboard-grid {
                grid-template-columns: repeat(6, 1fr);
            }
            
            #districtSelector, .achievement-list-container {
                grid-column: span 3;
            }
            
            .stats-card {
                grid-column: span 2;
            }
        }
        
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            #districtSelector, .achievement-list-container, .stats-card {
                grid-column: span 1;
            }
            
            .main-title {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .main-title {
                font-size: 2rem;
            }
            
            .filter-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="dashboard-header">
            <h1 class="main-title">广州市教学成果智能分析平台 - 增城区专项</h1>
            <p class="subtitle">增城区2025年广州市教学成果培育项目智能分析 · 个性化培育方案 · 对标优秀成果</p>
        </div>
        
        <!-- 筛选控制 -->
        <div class="filter-controls">
            <button class="filter-btn active" data-filter="all">全部项目</button>
            <button class="filter-btn" data-filter="key">重点项目</button>
            <button class="filter-btn" data-filter="general">一般项目</button>
            <button class="filter-btn" data-filter="preschool">学前教育</button>
            <button class="filter-btn" data-filter="k12">基础教育</button>
            <button class="filter-btn" data-filter="vocational">职业教育</button>

        <!-- 主内容区 -->
        <div class="dashboard-grid">

            <div class="dashboard-card" id="districtSelector">

                        </svg>

            <!-- 成果列表 -->

            <!-- 项目类型分布 -->
            <div class="dashboard-card" style="grid-column: span 6;">

            </div>
        </div>
    </div>
    
    <!-- 成果详情模态框 -->
    <div id="achievementDetailModal" class="detail-modal">

        // 更新统计数据

            const keyProjects = ZENGCHENG_PROJECTS.filter(p => p.level === '重点').length;
            const generalProjects = ZENGCHENG_PROJECTS.filter(p => p.level === '一般').length;
            const avgYears = (ZENGCHENG_PROJECTS.reduce((sum, p) => sum + p.years, 0) / ZENGCHENG_PROJECTS.length).toFixed(1);
            
            document.getElementById('totalProjects').textContent = ZENGCHENG_PROJECTS.length;
            document.getElementById('avgYears').textContent = avgYears;
            document.getElementById('keyProjects').textContent = keyProjects;
            document.getElementById('generalProjects').textContent = generalProjects;
        }
        
        // 加载成果列表
        function loadDistrictAchievements() {
            const listContainer = document.getElementById('achievementList');
            
            // 清空现有列表
            listContainer.innerHTML = '';
            
            let projects = ZENGCHENG_PROJECTS;
            
            // 应用筛选
            projects = filterProjects(projects);
            
            if (projects.length === 0) {
                listContainer.innerHTML = `
                    <div style="text-align: center; padding: 50px; color: var(--text-secondary);">
                        暂无符合筛选条件的成果
                    </div>
                `;
                return;
            }
            
            // 生成成果列表项
            projects.forEach(project => {
                const item = document.createElement('div');
                item.className = 'achievement-item';
                item.dataset.id = project.id;
                
                item.innerHTML = `
                    <div class="achievement-title">${project.title}</div>
                    <div class="achievement-meta">
                        <span>${project.category}</span>
                        <span>${project.years}年实践</span>
                        <span class="project-level ${project.level === '重点' ? 'level-key' : 'level-general'}">
                            ${project.level}项目
                        </span>
                        <span>${project.stageMapping ? project.stageMapping[project.stage] || project.stage : project.stage}</span>
                    </div>
                `;
                
                item.addEventListener('click', () => showAchievementDetail(project));
                listContainer.appendChild(item);
            });
        }
        
        // 筛选项目
        function filterProjects(projects) {
            if (currentFilter === 'all') return projects;
            
            return projects.filter(project => {
                switch(currentFilter) {
                    case 'key':
                        return project.level === '重点';
                    case 'general':
                        return project.level === '一般';
                    case 'preschool':
                        return project.stage === '学前';
                    case 'k12':
                        return ['小学', '初中', '高中'].includes(project.stage);
                    case 'vocational':
                        return project.stage === '中职';
                    default:
                        return true;
                }
            });
        }
        
        // 显示成果详情
        function showAchievementDetail(project) {
            // 更新模态框内容
            document.getElementById('detailTitle').textContent = project.title;
            
            // 更新优点亮点
            const strengthsContainer = document.getElementById('detailStrengths');
            strengthsContainer.innerHTML = project.strengths
                .map(strength => `<span class="strength-badge">${strength}</span>`)
                .join('');
            
            // 更新待优化方向
            const improvementsContainer = document.getElementById('detailImprovements');
            improvementsContainer.innerHTML = project.improvements
                .map(improvement => `<span class="warning-badge">${improvement}</span>`)
                .join('');
            
            // 更新参考信息
            const referenceContainer = document.getElementById('detailReference');
            referenceContainer.innerHTML = `
                <div class="reference-box">
                    <div class="reference-title">优秀成果参考</div>
                    <p>${project.reference}</p>
                </div>
            `;
            
            // 更新培育方案
            const planContainer = document.getElementById('detailPlan');
            planContainer.innerHTML = project.plan
                .map((plan, index) => `<div class="plan-item"><strong>步骤${index + 1}:</strong> ${plan}</div>`)
                .join('');
            
            // 显示模态框
            document.getElementById('achievementDetailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 筛选按钮
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    loadDistrictAchievements();
                });
            });
            
            // 关闭模态框
            document.getElementById('closeDetailModal').addEventListener('click', closeDetailModal);
            document.getElementById('achievementDetailModal').addEventListener('click', function(e) {
                if (e.target === this) closeDetailModal();
            });
            
            // ESC键关闭
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeDetailModal();
            });
        }
        
        // 关闭模态框
        function closeDetailModal() {
            document.getElementById('achievementDetailModal').classList.remove('active');
            document.body.style.overflow = 'auto';
